<VirtualHost *:8080>
	DocumentRoot /workspace/backend
	ServerName localhost

	# Test configuration first on the include path, exactly like the built-in server router does.
	php_admin_value include_path "/workspace/backend/test/http:/workspace/backend:."
	SetEnv KLOUDSPEAKER_HTTP_TEST_CONFIG /srv/web/current/settings.json

	<Directory /workspace/backend>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# The deployment instructions copy backend/include/apache/htaccess to include/.htaccess; including the same file
	# here applies exactly its directives, so Apache 2.4 compatibility of that (2.2 syntax) file is tested.
	<Directory /workspace/backend/include>
		Include /workspace/backend/include/apache/htaccess
	</Directory>

	ErrorLog /proc/self/fd/2
	CustomLog /proc/self/fd/1 combined
</VirtualHost>
